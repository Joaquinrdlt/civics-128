version: 1
backend:
  phases:
    build:
      commands:
        - |
          # Use Node 22 for Amplify backend synthesis and deployment.
          export NVM_DIR="$HOME/.nvm"
          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            mkdir -p "$NVM_DIR"
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          fi
          . "$NVM_DIR/nvm.sh"
          nvm install 22.12.0
          nvm use 22.12.0
          node --version
          npm install --include=dev --cache .npm --prefer-offline
          npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
frontend:
  phases:
    build:
      commands:
        - |
          # Install the build tools here so the build doesn't depend on preBuild running.
          export NVM_DIR="$HOME/.nvm"
          if [ ! -s "$NVM_DIR/nvm.sh" ]; then
            mkdir -p "$NVM_DIR"
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          fi
          . "$NVM_DIR/nvm.sh"
          nvm install 22.12.0
          nvm use 22.12.0
          node --version
          npm install --include=dev --cache .npm --prefer-offline
          npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
